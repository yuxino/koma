name: Apply source layering refactor

on:
  push:
    branches:
      - refactor/source-layering

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Reorganize source files and imports
        run: python3 .github/scripts/refactor_layering.py
      - name: Install dependencies
        run: npm ci
      - name: Verify refactor
        run: |
          npm run check
          git diff --check
      - name: Commit verified layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: organize client and server source layers"
          git push origin HEAD:${GITHUB_REF_NAME}
