name: Deploy Koma

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Resolve deployment settings
        id: deploy-meta
        run: |
          PROJECT_NAME="$(node -p "require('./package.json').name")"
          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "deploy_target=~/$PROJECT_NAME" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Check deployment secrets
        id: deploy-secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "SERVER_HOST or SERVER_PASSWORD is not configured; skipping remote deployment."
          fi

      - name: Deploy files to server
        if: steps.deploy-secrets.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "dist/,dist-server/,scripts/write-deployment-env.mjs,package.json,package-lock.json"
          target: ${{ steps.deploy-meta.outputs.deploy_target }}
          strip_components: 0

      - name: Restart Koma with pm2
        if: steps.deploy-secrets.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_PORT: "3010"
          ASR_PROVIDER: ${{ secrets.ASR_PROVIDER }}
          ASR_API_KEY: ${{ secrets.ASR_API_KEY }}
          ASR_BASE_URL: ${{ secrets.ASR_BASE_URL }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ASR_MODEL: ${{ secrets.ASR_MODEL }}
          VISION_PROVIDER: ${{ secrets.VISION_PROVIDER || secrets.ANALYSIS_PROVIDER }}
          VISION_API_KEY: ${{ secrets.VISION_API_KEY }}
          VISION_BASE_URL: ${{ secrets.VISION_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VISION_MODEL: ${{ secrets.VISION_MODEL }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          DEMO_REQUESTS_PER_IP_PER_DAY: ${{ secrets.DEMO_REQUESTS_PER_IP_PER_DAY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          KOMA_CONFIG_SECRET: ${{ secrets.KOMA_CONFIG_SECRET }}
          DB_DRIVER: ${{ secrets.DB_DRIVER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SSL: ${{ secrets.DB_SSL }}
          DB_AUTO_CREATE: ${{ secrets.DB_AUTO_CREATE }}
          STORAGE_DRIVER: ${{ secrets.STORAGE_DRIVER }}
          LOCAL_STORAGE_PATH: ${{ secrets.LOCAL_STORAGE_PATH }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_UPLOAD_PREFIX: ${{ secrets.OSS_UPLOAD_PREFIX }}
          OSS_PUBLIC_BASE_URL: ${{ secrets.OSS_PUBLIC_BASE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 30m
          envs: APP_PORT,ASR_PROVIDER,ASR_API_KEY,ASR_BASE_URL,DASHSCOPE_API_KEY,GROQ_API_KEY,OPENAI_API_KEY,ASR_MODEL,VISION_PROVIDER,VISION_API_KEY,VISION_BASE_URL,GEMINI_API_KEY,OPENROUTER_API_KEY,VISION_MODEL,PUBLIC_BASE_URL,DEMO_REQUESTS_PER_IP_PER_DAY,ADMIN_PASSWORD,KOMA_CONFIG_SECRET,DB_DRIVER,DB_HOST,DB_PORT,DB_USER,DB_PASSWORD,DB_NAME,DB_SSL,DB_AUTO_CREATE,STORAGE_DRIVER,LOCAL_STORAGE_PATH,OSS_REGION,OSS_ACCESS_KEY_ID,OSS_ACCESS_KEY_SECRET,OSS_BUCKET,OSS_UPLOAD_PREFIX,OSS_PUBLIC_BASE_URL
          script: |
            set -e
            runtime_version="22.13.1"
            runtime_root="$HOME/koma-runtime/node-v$runtime_version"
            node_bin="$runtime_root/bin/node"
            if [ ! -x "$node_bin" ]; then
              case "$(uname -m)" in
                x86_64) runtime_arch="x64" ;;
                aarch64|arm64) runtime_arch="arm64" ;;
                *) echo "Unsupported server architecture."; exit 1 ;;
              esac
              mkdir -p "$HOME/koma-runtime"
              install_dir="$(mktemp -d "$HOME/koma-runtime/.install.XXXXXX")"
              archive="node-v$runtime_version-linux-$runtime_arch.tar.xz"
              cd "$install_dir"
              curl -fsSLO "https://nodejs.org/dist/v$runtime_version/$archive"
              curl -fsSLO "https://nodejs.org/dist/v$runtime_version/SHASUMS256.txt"
              grep "  $archive$" SHASUMS256.txt | sha256sum -c - >/dev/null
              tar -xJf "$archive"
              mv "node-v$runtime_version-linux-$runtime_arch" "$runtime_root"
              find "$install_dir" -depth -delete
            fi
            export PATH="$runtime_root/bin:$PATH"
            expected_database="${DB_DRIVER:-}"
            expected_storage="${STORAGE_DRIVER:-}"
            expected_admin="false"
            if [ -n "${ADMIN_PASSWORD:-}" ]; then expected_admin="true"; fi
            cd ${{ steps.deploy-meta.outputs.deploy_target }}
            npm install --omit=dev --no-audit --no-fund --prefer-offline
            "$node_bin" scripts/write-deployment-env.mjs .env
            unset PORT APP_PORT ASR_PROVIDER ASR_API_KEY ASR_BASE_URL ASR_MODEL
            unset DASHSCOPE_API_KEY GROQ_API_KEY OPENAI_API_KEY
            unset VISION_PROVIDER VISION_API_KEY VISION_BASE_URL VISION_MODEL
            unset GEMINI_API_KEY OPENROUTER_API_KEY PUBLIC_BASE_URL ASR_DIARIZATION
            unset DEMO_REQUESTS_PER_IP_PER_DAY ADMIN_PASSWORD KOMA_CONFIG_SECRET
            unset DB_DRIVER KOMA_DATABASE_PATH DB_HOST DB_PORT DB_USER DB_PASSWORD
            unset DB_NAME DB_SSL DB_CONNECTION_LIMIT DB_AUTO_CREATE
            unset STORAGE_DRIVER LOCAL_STORAGE_PATH OSS_REGION OSS_ACCESS_KEY_ID
            unset OSS_ACCESS_KEY_SECRET OSS_BUCKET OSS_UPLOAD_PREFIX OSS_PUBLIC_BASE_URL
            unset OSS_SIGNED_URL_SECONDS OSS_TIMEOUT_MS TRUST_PROXY
            pm2 delete ding-frame 2>/dev/null || true
            pm2 delete koma 2>/dev/null || true
            pm2 start dist-server/index.js --name koma --interpreter "$node_bin"
            pm2 save

            health_json=""
            for attempt in $(seq 1 15); do
              if health_json="$(curl -fsS http://127.0.0.1:3010/api/health 2>/dev/null)"; then
                break
              fi
              sleep 2
            done
            "$node_bin" - "$health_json" "$expected_database" "$expected_storage" "$expected_admin" <<'NODE'
            const [raw, expectedDatabase, expectedStorage, expectedAdmin] = process.argv.slice(2);
            const health = JSON.parse(raw || "{}");
            const summary = {
              ok: health.ok === true,
              database: health.database?.driver || null,
              storage: health.storage?.driver || null,
              admin: health.features?.admin === true
            };
            console.log(JSON.stringify(summary));
            if (!summary.ok) process.exit(1);
            if (expectedDatabase && summary.database !== expectedDatabase) process.exit(1);
            if (expectedStorage && summary.storage !== expectedStorage) process.exit(1);
            if (expectedAdmin === "true" && !summary.admin) process.exit(1);
            NODE
